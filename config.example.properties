# WatchMatch settings. build.sh copies this file to config.properties the first time; edit that one and rebuild.

# The names shown on the TV: the launcher's and the movies-and-series catalog's (also the app labels in the TV's
# settings). Leave them out to keep these defaults.
app_name=WatchMatch
catalog_name=Watchme+
# The smart search's name (say or type "new gangster movies" / "افلام عصابات جديده").
spark_name=Spark

# Free key from https://www.themoviedb.org/settings/api (the "API Read Access Token" or the "API Key").
# Without it, the home screen still works, just without the trending picks.
tmdb_key=

# Free key from Google (console.cloud.google.com: enable "YouTube Data API v3", then Credentials > API key).
# Finds the YouTube videos you watch on the TV, for Continue watching.
youtube_key=
# Optional, to sign in to YouTube on the TV (read-only): your subscriptions' new videos in the big photo and your liked
# videos. In the same Google Cloud project: Credentials > OAuth client ID > "TVs and Limited Input devices".
youtube_client_id=
youtube_client_secret=

# Your country (two letters): decides which titles are on which streaming app. US, GB, CA, BR, DE, FR...
tmdb_region=US

# Your city, for the weather and the sunset that turns the home screen dark at night (decimal degrees).
latitude=40.7128
longitude=-74.0060
# Optional: the name shown on the weather card (empty = "Weather").
city=

# Optional: your first name, for the home screen's greeting ("Good evening, Sara").
name=

# Match Centre: your teams (their matches get the match-day card, a reminder 10 min before over any app, and a live
# score in the corner with goal alerts), and the competitions to show (ESPN's codes: uefa.champions, uefa.europa,
# eng.1, esp.1, ita.1, ger.1, fra.1, ksa.1...).
teams=
leagues=uefa.champions,eng.1,esp.1

# auto (follows the TV), en, es, pt or ar
language=auto

# true shows cryptocurrency prices from Binance on the home screen and screensaver.
show_crypto=true

# Crypto prices: USD, BRL, EUR... (used only when show_crypto=true)
currency=USD

# C, F, or auto (Fahrenheit when the TV is set to the US)
temperature=auto

# true also turns off Google Assistant ("Ok Google"); the remote's mic button stops working
disable_assistant=false

# Optional: cross-device sync for Watchme+ (Continue watching, My List, ratings) on a Supabase backend.
# Sync is switched off, and its Settings entry hidden, while these are empty: the public release build has none.
# Both values are public keys (the anon key is public by design), safe to put in a build. Never the service-role key.
supabase_url=
supabase_anon_key=
# Where the web app lives (shown when someone needs to reset an account password, which is done on the website).
site_url=https://watch-me-plus.vercel.app
